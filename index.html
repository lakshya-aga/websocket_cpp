<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpp_chat</title>
<style>
  :root {
    --bg:        #f4f5f7;
    --panel:     #ffffff;
    --border:    #dfe3e8;
    --text:      #1c1e21;
    --muted:     #6b7280;
    --accent:    #2563eb;
    --accent-fg: #ffffff;
    --bubble:    #eceff3;
    --ok:        #16a34a;
    --bad:       #dc2626;
    --warn:      #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:     #16181c;
      --panel:  #1e2126;
      --border: #2f343b;
      --text:   #e6e8eb;
      --muted:  #9aa3ad;
      --accent: #3b82f6;
      --bubble: #2a2f36;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  #app {
    width: min(720px, 100%);
    height: min(760px, 100%);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header .sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  #status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  #dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #dot.up      { background: var(--ok); }
  #dot.down    { background: var(--bad); }
  #dot.pending { background: var(--warn); }

  #who {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
  }
  #who input {
    flex: 1;
    min-width: 0;
    padding: 6px 9px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #who input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row { display: flex; }
  .row.self { justify-content: flex-end; }

  .msg {
    max-width: 78%;
    padding: 7px 11px;
    border-radius: 14px;
    background: var(--bubble);
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .row.self .msg {
    background: var(--accent);
    color: var(--accent-fg);
  }
  .msg .from {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 1px;
  }
  .row.self .msg .from { display: none; }

  .sys {
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    padding: 2px 0;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #text {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
  }
  #text:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    padding: 9px 18px;
    font: inherit;
    font-weight: 500;
    color: var(--accent-fg);
    background: var(--accent);
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>cpp_chat</h1>
    <span class="sub">Boost.Beast &middot; C++</span>
    <span id="status"><span id="dot"></span><span id="statusText">connecting</span></span>
  </header>

  <div id="who">
    <label for="name">Name</label>
    <input id="name" maxlength="24" placeholder="anonymous" autocomplete="off">
  </div>

  <div id="log" aria-live="polite"></div>

  <form id="composer">
    <input id="text" placeholder="Message" autocomplete="off" maxlength="2000">
    <button id="send" type="submit" disabled>Send</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var log        = document.getElementById("log");
  var nameInput  = document.getElementById("name");
  var textInput  = document.getElementById("text");
  var sendButton = document.getElementById("send");
  var composer   = document.getElementById("composer");
  var dot        = document.getElementById("dot");
  var statusText = document.getElementById("statusText");

  var ws       = null;
  var attempts = 0;
  var timer    = null;

  // Remember the display name across reloads. Wrapped because storage
  // access itself can throw in private windows.
  try {
    nameInput.value = localStorage.getItem("cpp_chat_name") || "";
  } catch (e) { /* ignore */ }

  nameInput.addEventListener("change", function () {
    try { localStorage.setItem("cpp_chat_name", nameInput.value); } catch (e) {}
  });

  function myName() {
    return (nameInput.value || "").trim() || "anonymous";
  }

  function atBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  }

  function scroll(wasAtBottom) {
    if (wasAtBottom) log.scrollTop = log.scrollHeight;
  }

  function system(msg) {
    var wasAtBottom = atBottom();
    var el = document.createElement("div");
    el.className = "sys";
    el.textContent = msg;          // textContent, never innerHTML
    log.appendChild(el);
    scroll(wasAtBottom);
  }

  // The server is a dumb broadcaster: it relays the exact bytes it
  // received to every session, including the sender. So we render only
  // what comes back over the wire -- never optimistically -- which is
  // what keeps messages from appearing twice.
  function message(raw) {
    var wasAtBottom = atBottom();

    var from = "", body = raw;
    var sep = raw.indexOf(": ");
    if (sep > 0 && sep <= 24) {
      from = raw.slice(0, sep);
      body = raw.slice(sep + 2);
    }

    var row = document.createElement("div");
    row.className = "row" + (from && from === myName() ? " self" : "");

    var bubble = document.createElement("div");
    bubble.className = "msg";

    if (from) {
      var who = document.createElement("span");
      who.className = "from";
      who.textContent = from;
      bubble.appendChild(who);
    }
    bubble.appendChild(document.createTextNode(body));

    row.appendChild(bubble);
    log.appendChild(row);
    scroll(wasAtBottom);
  }

  function setStatus(state, label) {
    dot.className = state;
    statusText.textContent = label;
    var up = state === "up";
    sendButton.disabled = !up;
    textInput.disabled  = !up;
  }

  function connect() {
    clearTimeout(timer);

    // Same host that served this page, so the demo works unchanged
    // whether you hit localhost or the machine's LAN address.
    var scheme = location.protocol === "https:" ? "wss://" : "ws://";
    var url    = scheme + (location.host || "localhost:8080");

    setStatus("pending", "connecting");
    ws = new WebSocket(url);

    ws.onopen = function () {
      attempts = 0;
      setStatus("up", "connected");
      system("connected to " + url);
      textInput.focus();
    };

    ws.onmessage = function (ev) {
      message(String(ev.data));
    };

    ws.onclose = function () {
      setStatus("down", "disconnected");
      // Exponential backoff, capped at 10s.
      var delay = Math.min(1000 * Math.pow(2, attempts++), 10000);
      system("disconnected — retrying in " + (delay / 1000) + "s");
      timer = setTimeout(connect, delay);
    };

    ws.onerror = function () {
      // onclose always follows, so reconnection is handled there.
      setStatus("down", "error");
    };
  }

  composer.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var body = textInput.value.trim();
    if (!body || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(myName() + ": " + body);
    textInput.value = "";
  });

  connect();
})();
</script>
</body>
</html>
